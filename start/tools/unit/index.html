<!DOCTYPE html>
<html lang="zh-CN" data-theme="light-neutral">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="../../../img/asys.ico" type="image/x-icon">
  <title>单位与汇率换算 - ASYS 工具箱</title>
  <link rel="stylesheet" href="../css/tools.css?v=202608260107">
  <style>
    .conv-card { display: flex; flex-direction: column; gap: 0.9rem; }
    .swap-btn { align-self: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; padding: 0; }
    .swap-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(180deg); }
    .swap-btn svg { width: 16px; height: 16px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .currency-rate { font-size: 0.78rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .currency-rate .rate-update { opacity: 0.8; }
    .currency-rate .refresh { color: var(--accent); cursor: pointer; background: none; border: none; font-size: 0.75rem; padding: 2px 6px; text-decoration: underline; font-family: inherit; }
    .big-result { font-size: 1.3rem; font-weight: 700; color: var(--accent); word-break: break-all; line-height: 1.4; }
    .rate-source { font-size: 0.72rem; color: var(--text-secondary); opacity: 0.75; margin-top: 4px; }
    .cat-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .cat-btn { padding: 5px 12px; border: 1px solid var(--border-color); border-radius: 50px; font-size: 0.78rem; color: var(--text-secondary); cursor: pointer; transition: all 0.15s ease; background: var(--input-bg); font-family: inherit; }
    .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cat-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  </style>
</head>
<body>
  <header>
    <a class="back-btn" href="../../index.html" title="返回起始页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>起始页</span>
    </a>
    <h1>单位与汇率换算</h1>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="unit">单位换算</button>
      <button class="tab" data-tab="currency">汇率换算</button>
    </div>

    <!-- 单位换算 -->
    <div class="tab-pane show" id="pane-unit">
      <div class="card glass conv-card">
        <div class="cat-row" id="catBtns"></div>
        <div class="row">
          <select class="input grow" id="unitFrom"></select>
          <select class="input grow" id="unitTo"></select>
        </div>
        <div class="input-group">
          <input class="input" type="number" id="unitValue" placeholder="输入数值" value="1">
        </div>
        <button class="swap-btn" id="unitSwap" title="交换单位">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        </button>
        <div class="input-group">
          <span class="label">换算结果</span>
          <div class="big-result" id="unitResult">—</div>
        </div>
      </div>
    </div>

    <!-- 汇率换算 -->
    <div class="tab-pane" id="pane-currency">
      <div class="card glass conv-card" style="align-items:center;padding:2.5rem 1rem;text-align:center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-color);margin-bottom:4px;"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        <div style="font-size:1rem;font-weight:600;color:var(--text-primary);">汇率换算正在施工中</div>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px;">免费汇率 API 国内可用性差（需 key / 被墙 / CORS 限制），暂缓上线<br>后续找到稳定数据源后恢复</div>
      </div>
    </div>
  </main>

  <footer>
    <p>ASYS 工具箱 · 单位换算 / 汇率换算</p>
  </footer>

  <script>
const $ = id => document.getElementById(id);

    // ===== Tab 切换 =====
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('show', p.id === 'pane-' + t.dataset.tab));
      });
    });

    // ===== 单位换算 =====
    const CATEGORIES = {
      length: { name: '长度', units: { 'm': 1, 'km': 1000, 'cm': 0.01, 'mm': 0.001, 'mi': 1609.344, 'yd': 0.9144, 'ft': 0.3048, 'in': 0.0254, '里': 500, '尺': 0.333333 } },
      weight: { name: '重量', units: { 'kg': 1, 'g': 0.001, 'mg': 0.000001, 't': 1000, 'lb': 0.45359237, 'oz': 0.02834952, '斤': 0.5, '两': 0.05 } },
      area: { name: '面积', units: { 'm²': 1, 'km²': 1000000, 'cm²': 0.0001, 'ha': 10000, '亩': 666.6667, 'acre': 4046.8564, 'ft²': 0.092903 } },
      volume: { name: '体积', units: { 'L': 1, 'mL': 0.001, 'm³': 1000, 'cm³': 0.001, 'gal': 3.785412, 'qt': 0.946353, 'pt': 0.473176, 'cup': 0.24, 'fl oz': 0.0295735 } },
      speed: { name: '速度', units: { 'm/s': 1, 'km/h': 0.277778, 'mph': 0.44704, 'kn': 0.514444, 'ft/s': 0.3048 } },
      time: { name: '时间', units: { 's': 1, 'ms': 0.001, 'min': 60, 'h': 3600, 'day': 86400, 'week': 604800, 'year': 31557600 } },
      storage: { name: '存储', units: { 'B': 1, 'KB': 1024, 'MB': 1048576, 'GB': 1073741824, 'TB': 1099511627776, 'bit': 0.125 } },
      temperature: { name: '温度', custom: true, units: ['°C', '°F', 'K'] }
    };
    const TEMP_FUNCS = {
      '°C': { toBase: v => v, fromBase: v => v },
      '°F': { toBase: v => (v - 32) * 5 / 9, fromBase: v => v * 9 / 5 + 32 },
      'K': { toBase: v => v - 273.15, fromBase: v => v + 273.15 }
    };

    let currentCat = 'length';
    const catBtns = $('catBtns');
    Object.entries(CATEGORIES).forEach(([key, cat]) => {
      const b = document.createElement('button');
      b.className = 'cat-btn' + (key === currentCat ? ' active' : '');
      b.textContent = cat.name;
      b.addEventListener('click', () => {
        currentCat = key;
        catBtns.querySelectorAll('.cat-btn').forEach(x => x.classList.toggle('active', x === b));
        fillUnits();
        updateUnit();
      });
      catBtns.appendChild(b);
    });

    function fillUnits() {
      const cat = CATEGORIES[currentCat];
      const from = $('unitFrom'), to = $('unitTo');
      const units = cat.custom ? cat.units : Object.keys(cat.units);
      from.innerHTML = ''; to.innerHTML = '';
      units.forEach(u => {
        from.appendChild(new Option(u, u));
        to.appendChild(new Option(u, u));
      });
      // 默认给个不同的单位对（温度常用 C→F）
      if (units.length > 1) to.value = units[units.length - 1];
      if (currentCat === 'temperature') { from.value = '°C'; to.value = '°F'; }
      if (currentCat === 'storage') { from.value = 'MB'; to.value = 'GB'; }
    }

    function updateUnit() {
      const cat = CATEGORIES[currentCat];
      const v = parseFloat($('unitValue').value);
      if (isNaN(v)) { $('unitResult').textContent = '—'; return; }
      const from = $('unitFrom').value, to = $('unitTo').value;
      let base, result;
      if (cat.custom) {
        base = TEMP_FUNCS[from].toBase(v);
        result = TEMP_FUNCS[to].fromBase(base);
      } else {
        base = v * cat.units[from];
        result = base / cat.units[to];
      }
      $('unitResult').textContent = formatNum(result) + ' ' + to;
    }

    function formatNum(n) {
      if (!isFinite(n)) return '∞';
      if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0)) return n.toExponential(4);
      const s = parseFloat(n.toPrecision(12));
      return String(s).length > 14 ? n.toPrecision(10).replace(/\.?0+$/, '') : String(s);
    }

    $('unitValue').addEventListener('input', updateUnit);
    $('unitFrom').addEventListener('change', updateUnit);
    $('unitTo').addEventListener('change', updateUnit);
    $('unitSwap').addEventListener('click', () => {
      const f = $('unitFrom'), t = $('unitTo');
      const tmp = f.value; f.value = t.value; t.value = tmp;
      updateUnit();
    });
    fillUnits(); updateUnit();

  </script>
  <script src="../theme.js?v=202608260107"></script>
</body>
</html>
