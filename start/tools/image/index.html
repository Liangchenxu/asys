<!DOCTYPE html>
<html lang="zh-CN" data-theme="light-neutral">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="../../../img/asys.ico" type="image/x-icon">
  <title>图片压缩与格式转换 - ASYS 工具箱</title>
  <link rel="stylesheet" href="../css/tools.css">
  <style>
    .drop-zone { border: 2px dashed var(--input-border); border-radius: 14px; padding: 2.2rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s ease; background: var(--input-bg); }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--suggestion-hover, rgba(0,0,0,0.03)); }
    .drop-zone svg { width: 40px; height: 40px; color: var(--icon-color); margin-bottom: 8px; }
    .drop-zone .dz-title { font-size: 0.95rem; color: var(--text-primary); }
    .drop-zone .dz-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px; }
    .drop-zone input[type="file"] { display: none; }
    .work-area { display: none; flex-direction: column; gap: 0.9rem; }
    .work-area.show { display: flex; }
    .preview-row { display: flex; gap: 10px; align-items: stretch; }
    .preview-box { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .preview-box .pb-label { font-size: 0.78rem; color: var(--text-secondary); }
    .preview-box .pb-info { font-size: 0.72rem; color: var(--text-secondary); opacity: 0.9; }
    .preview-box img { max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--border-color); background: repeating-conic-gradient(#00000022 0% 25%, transparent 0% 50%) 50% / 16px 16px; object-fit: contain; }
    .opt-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .opt-row .label { min-width: 80px; }
    .opt-row .grow { display: flex; align-items: center; gap: 8px; }
    .opt-row .grow .range { flex: 1; }
    .opt-val { font-size: 0.8rem; color: var(--accent); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .size-info { font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; }
    .size-info .save { color: #059669; font-weight: 600; }
    .size-info .worse { color: #e11d48; font-weight: 600; }
    .result-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .fmt-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .fmt-btn { padding: 6px 14px; border: 1px solid var(--border-color); border-radius: 50px; font-size: 0.82rem; color: var(--text-secondary); cursor: pointer; transition: all 0.15s ease; background: var(--input-bg); font-family: inherit; font-weight: 600; }
    .fmt-btn:hover { border-color: var(--accent); color: var(--accent); }
    .fmt-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .fmt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .note { font-size: 0.74rem; color: var(--text-secondary); opacity: 0.85; line-height: 1.6; }
    .privacy-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 50px; background: rgba(5, 150, 105, 0.12); color: #059669; font-size: 0.72rem; font-weight: 600; }
    .privacy-badge svg { width: 12px; height: 12px; }
  </style>
</head>
<body>
  <header>
    <a class="back-btn" href="../../index.html" title="返回起始页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>起始页</span>
    </a>
    <h1>图片压缩与格式转换</h1>
  </header>

  <main>
    <div class="card glass">
      <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <div class="dz-title">点击选择或拖拽图片到这里</div>
        <div class="dz-sub">支持 PNG / JPG / WebP / GIF / BMP / AVIF / SVG</div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif,image/svg+xml">
      </div>
      <div class="privacy-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        图片仅在本地处理，不会上传到任何服务器
      </div>
    </div>

    <div class="work-area" id="workArea">
      <div class="card glass">
        <div class="preview-row">
          <div class="preview-box">
            <span class="pb-label">原图</span>
            <img id="origPreview" alt="原图">
            <span class="pb-info" id="origInfo"></span>
          </div>
          <div class="preview-box">
            <span class="pb-label">转换结果</span>
            <img id="outPreview" alt="转换结果">
            <span class="pb-info" id="outInfo"></span>
          </div>
        </div>

        <div class="opt-row">
          <span class="label">输出格式</span>
          <div class="fmt-btns grow" id="fmtBtns"></div>
        </div>

        <div class="opt-row" id="qualityRow">
          <span class="label">压缩质量</span>
          <div class="grow">
            <input type="range" class="range" id="qualityRange" min="10" max="100" value="80">
            <span class="opt-val" id="qualityVal">80%</span>
          </div>
        </div>

        <div class="opt-row" id="scaleRow">
          <span class="label">缩放</span>
          <div class="grow">
            <input type="range" class="range" id="scaleRange" min="5" max="100" value="100">
            <span class="opt-val" id="scaleVal">100%</span>
          </div>
        </div>

        <div class="opt-row">
          <span class="label">尺寸</span>
          <div class="grow size-info" id="sizeInfo"></div>
        </div>

        <div class="result-actions">
          <button class="btn" id="downloadBtn">
            <span id="downloadLabel">下载</span>
          </button>
          <button class="btn secondary" id="reloadBtn">重新选择</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>ASYS 工具箱 · 图片工具 —— 全部处理在您的浏览器本地完成</p>
  </footer>

  <script>

    const $ = id => document.getElementById(id);
    const dropZone = $('dropZone'), fileInput = $('fileInput');
    const workArea = $('workArea');

    // 可用输出格式（按浏览器能力检测）
    const canEncode = (() => {
      const c = document.createElement('canvas');
      const tests = {
        'PNG': 'image/png', 'JPEG': 'image/jpeg', 'WEBP': 'image/webp',
        'AVIF': 'image/avif', 'BMP': 'image/bmp', 'GIF': 'image/gif'
      };
      const out = {};
      for (const [name, mime] of Object.entries(tests)) {
        try { out[name] = c.toDataURL(mime).startsWith('data:' + mime); } catch (e) { out[name] = false; }
      }
      return out;
    })();
    const FMT_ORDER = ['PNG', 'JPEG', 'WEBP', 'AVIF', 'BMP', 'GIF'];

    let origFile = null, origImg = null, origName = '', blobUrl = null;
    let currentFmt = 'PNG', timer = null;

    function fmtMime(fmt) { return { PNG: 'image/png', JPEG: 'image/jpeg', WEBP: 'image/webp', AVIF: 'image/avif', BMP: 'image/bmp', GIF: 'image/gif' }[fmt]; }
    function fmtExt(fmt) { return fmt === 'JPEG' ? 'jpg' : fmt.toLowerCase(); }

    // 渲染格式按钮
    const fmtBtns = $('fmtBtns');
    let availableFmts = FMT_ORDER.filter(f => canEncode[f]);
    if (!availableFmts.length) availableFmts = ['PNG'];
    availableFmts.forEach(f => {
      const b = document.createElement('button');
      b.className = 'fmt-btn' + (f === currentFmt ? ' active' : '');
      b.textContent = f;
      b.dataset.fmt = f;
      b.disabled = !canEncode[f];
      b.addEventListener('click', () => {
        currentFmt = f;
        fmtBtns.querySelectorAll('.fmt-btn').forEach(x => x.classList.toggle('active', x.dataset.fmt === f));
        $('qualityRow').style.display = (f === 'PNG' || f === 'BMP') ? 'none' : 'flex';
        scheduleConvert();
      });
      fmtBtns.appendChild(b);
    });
    $('qualityRow').style.display = (currentFmt === 'PNG' || currentFmt === 'BMP') ? 'none' : 'flex';

    // 拖拽/选择
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFile(fileInput.files[0]); });

    $('reloadBtn').addEventListener('click', () => { resetAll(); });
    $('downloadBtn').addEventListener('click', download);

    function resetAll() {
      fileInput.value = '';
      workArea.classList.remove('show');
      if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
      origFile = null; origImg = null; origName = '';
    }

    function loadFile(file) {
      if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
      resetAll();
      origFile = file;
      origName = file.name.replace(/\.[^.]+$/, '') || 'image';
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          origImg = img;
          $('origPreview').src = e.target.result;
          $('origInfo').textContent = `${img.naturalWidth}×${img.naturalHeight} · ${fmtSize(file.size)}`;
          workArea.classList.add('show');
          // 根据原图类型智能选默认输出格式
          const srcExt = (file.name.split('.').pop() || '').toLowerCase();
          const map = { png: 'PNG', jpg: 'JPEG', jpeg: 'JPEG', webp: 'WEBP', gif: 'GIF', bmp: 'BMP', avif: 'AVIF', svg: 'PNG' };
          if (map[srcExt] && canEncode[map[srcExt]]) {
            currentFmt = map[srcExt];
            fmtBtns.querySelectorAll('.fmt-btn').forEach(x => x.classList.toggle('active', x.dataset.fmt === currentFmt));
            $('qualityRow').style.display = (currentFmt === 'PNG' || currentFmt === 'BMP') ? 'none' : 'flex';
          }
          // GIF/AVIF 动画提示
          scheduleConvert();
        };
        img.onerror = () => alert('图片加载失败');
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(2) + ' MB';
    }

    $('qualityRange').addEventListener('input', e => { $('qualityVal').textContent = e.target.value + '%'; scheduleConvert(); });
    $('scaleRange').addEventListener('input', e => { $('scaleVal').textContent = e.target.value + '%'; scheduleConvert(); });

    function scheduleConvert() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(convert, 250);
    }

    async function convert() {
      if (!origImg) return;
      const quality = parseInt($('qualityRange').value) / 100;
      const scale = parseInt($('scaleRange').value) / 100;
      const w = Math.max(1, Math.round(origImg.naturalWidth * scale));
      const h = Math.max(1, Math.round(origImg.naturalHeight * scale));

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      // BMP 不支持透明，垫白底
      if (currentFmt === 'BMP' || currentFmt === 'JPEG') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
      }
      ctx.drawImage(origImg, 0, 0, w, h);

      const mime = fmtMime(currentFmt);
      const blob = await new Promise(res => {
        // AVIF 质量参数浏览器差异大，用默认即可
        canvas.toBlob(b => res(b), mime, currentFmt === 'AVIF' ? undefined : quality);
      });

      if (!blob) { $('outInfo').textContent = '该格式导出失败'; return; }
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(blob);
      $('outPreview').src = blobUrl;

      const savePct = Math.round((1 - blob.size / origFile.size) * 100);
      const sizeInfo = $('sizeInfo');
      const sign = savePct >= 0 ? '↓ 缩小 ' + savePct + '%' : '↑ 增大 ' + (-savePct) + '%';
      sizeInfo.innerHTML = `<span>${w}×${h}</span><span>原 ${fmtSize(origFile.size)} → 新 ${fmtSize(blob.size)}</span><span class="${savePct >= 0 ? 'save' : 'worse'}">${sign}</span>`;

      $('downloadLabel').textContent = `下载 ${currentFmt} (${fmtSize(blob.size)})`;
    }

    function download() {
      if (!blobUrl) return;
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = origName + '-converted.' + fmtExt(currentFmt);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
  <script src="../theme.js"></script>
</body>
</html>
