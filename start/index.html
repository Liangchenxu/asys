<!DOCTYPE html>
<html lang="zh-CN" data-theme="light-neutral">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>ASYS 搜索起始页</title>
  <link rel="stylesheet" href="style.css?v=202608260107">
</head>
<body>
  <div class="wallpaper-bg" id="wallpaperBg"><img id="wallpaperImg" src="" alt="Bing Wallpaper" /></div>

  <header>
    <a href="https://asystech.cn" class="logo" title="访问 ASYS 官网" aria-label="ASYS 官网" target="_blank" rel="noopener noreferrer">

        <path d="M2168.2 244.7C1645.8-115.7 940.6-74.1 466.7 343.8c-468.9 413.4-601.5 1098-320 1659.1-161.9-550.5 11.2-1147.2 442-1524.7C1022.6 98.1 1641.9 6.5 2168.2 244.7" style="fill:#ff9500"/>
      </svg>
    </a>

    <div style="position: relative;">
      <button class="theme-toggle glass" id="themeToggle" aria-haspopup="true" aria-expanded="false" title="主题设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      
      <div class="theme-panel glass" id="themePanel" role="dialog" aria-label="主题设置">
        <div class="mode-switch-section">
          <div class="mode-switch-label"><span>深色模式</span><label class="mode-toggle"><input type="checkbox" id="darkModeToggle"><span class="mode-slider"></span></label></div>
        </div>
        
        <div class="auto-theme-section">
          <div class="mode-switch-label" style="margin-bottom:4px;"><span>自动切换主题</span></div>
          <div class="auto-theme-options">
            <label class="auto-radio"><input type="radio" name="autoTheme" value="off"><span>关闭</span></label>
            <label class="auto-radio"><input type="radio" name="autoTheme" value="system" checked><span>跟随系统</span></label>
            <label class="auto-radio"><input type="radio" name="autoTheme" value="time"><span>定时切换</span></label>
          </div>
          <div class="time-settings" id="timeSettings">
            <label><span>进入深色</span><input type="time" id="darkTime" value="18:00"></label>
            <label><span>进入浅色</span><input type="time" id="lightTime" value="06:00"></label>
          </div>
        </div>
        
        <div class="color-palette-section">
          <div class="palette-label">色彩主题</div>
          <div class="color-options" id="colorOptions">
            <div class="color-indicator" id="colorIndicator" aria-hidden="true"></div>
            <button class="color-btn active" data-color="neutral" title="中性灰" aria-label="中性灰主题"></button>
            <button class="color-btn" data-color="blue" title="静谧蓝" aria-label="静谧蓝主题"></button>
            <button class="color-btn" data-color="green" title="清新绿" aria-label="清新绿主题"></button>
            <button class="color-btn" data-color="purple" title="优雅紫" aria-label="优雅紫主题"></button>
            <button class="color-btn" data-color="orange" title="活力橙" aria-label="活力橙主题"></button>
          </div>
        </div>
        
        <div class="wallpaper-section">
          <div class="wallpaper-label"><span>使用网络图片作为背景</span><label class="mode-toggle"><input type="checkbox" id="wallpaperToggle"><span class="mode-slider"></span></label></div>
        </div>
        
        <div class="quicklinks-section">
          <div class="quicklinks-label"><span>快捷链接</span><label class="mode-toggle"><input type="checkbox" id="quicklinksToggle"><span class="mode-slider"></span></label></div>
          <div class="quicklinks-editor" id="quicklinksEditor">
            <div class="ql-input-wrap">
              <div class="ql-lines" id="quicklinksLines" aria-hidden="true"></div>
              <textarea id="quicklinksInput" rows="5" placeholder="每行一个链接：名称 地址（可省略 https://）&#10;示例：&#10;ASYS 官网 asystech.cn&#10;GitHub github.com"></textarea>
            </div>
            <button class="mini-btn wide" id="quicklinksSave">保存</button>
          </div>
        </div>
        
        <div class="clock-section">
          <div class="clock-label">时钟显示</div>
          <div class="clock-toggle-grid">
            <label class="clock-toggle-item"><span>日期</span><input type="checkbox" id="clockDate"></label>
            <label class="clock-toggle-item"><span>星期</span><input type="checkbox" id="clockWeek"></label>
            <label class="clock-toggle-item"><span>农历</span><input type="checkbox" id="clockLunar"></label>
            <label class="clock-toggle-item"><span>节气/节日</span><input type="checkbox" id="clockTerm"></label>
            <label class="clock-toggle-item"><span>24小时制</span><input type="checkbox" id="clock24h"></label>
            <label class="clock-toggle-item"><span>显示秒</span><input type="checkbox" id="clockSeconds"></label>
          </div>
        </div>
        
        <div class="position-section">
          <div class="position-label"><span>搜索框垂直位置</span></div>
          <input type="range" class="position-slider" id="positionSlider" min="5" max="50" value="25" step="1">
          <div class="position-value" id="positionValue">25% (默认)</div>
        </div>
      </div>
    </div>
  </header>

  <main id="mainContent">
    <div class="clock-display" id="clockDisplay" title="时间">--:--</div>
    <div class="clock-info" id="clockInfo"></div>
    <div class="search-wrapper">
      <div class="search-box">
        <div class="glass" style="border-radius: 50px; position: relative;">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索关键词..." autocomplete="off" autofocus aria-label="搜索关键词" />
          <button type="button" class="search-icon-btn" id="searchIconBtn" aria-label="执行搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
        <div class="suggestions-container" id="suggestionsContainer"><div id="suggestionsList"></div></div>
      </div>
      <div class="engine-selector" role="tablist" aria-label="选择搜索引擎">
        <button class="engine-btn active" data-engine="bing" role="tab" aria-selected="true">Bing</button>
        <button class="engine-btn" data-engine="baidu" role="tab">百度</button>
        <button class="engine-btn" data-engine="google" role="tab">谷歌</button>
        <button class="engine-btn" data-engine="duckduckgo" role="tab">DuckDuckGo</button>
        <button class="engine-btn" data-engine="yandex" role="tab">Yandex</button>
      </div>
    </div>
    <div class="quicklinks" id="quicklinksBar"></div>
  </main>

  <button type="button" class="wallpaper-refresh-btn" id="wallpaperRefresh" title="换一张壁纸" aria-label="换一张壁纸">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
  </button>

  <button type="button" class="toolbox-btn" id="toolboxToggle" aria-haspopup="true" aria-expanded="false" title="工具箱" aria-label="工具箱">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
  </button>
  <div class="toolbox-panel glass" id="toolboxPanel" role="dialog" aria-label="工具箱">
    <div class="toolbox-title">工具箱</div>
    <div class="tool-grid">
      <a class="tool-item" href="./ms-zh/index.html" title="巨硬中文翻译器">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg></span>
        <span class="tool-info">
          <span class="tool-name">巨硬中文翻译器</span>
          <span class="tool-desc">巨硬式机翻 · 词对词硬翻</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
      <a class="tool-item" href="./tools/image/index.html" title="图片压缩与格式转换">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></span>
        <span class="tool-info">
          <span class="tool-name">图片压缩转换</span>
          <span class="tool-desc">压缩 · 转格式 · 本地处理</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
      <a class="tool-item" href="./tools/unit/index.html" title="单位换算">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-6-6 6 6 0 0 0-6 6c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span>
        <span class="tool-info">
          <span class="tool-name">单位换算</span>
          <span class="tool-desc">长度/重量/温度/存储等</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
      <a class="tool-item" href="./tools/tomato/index.html" title="番茄钟">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.7 1.33 10.28 4 13l8 8 8-8c2.67-2.72 2.54-6.3.42-8.42z"></path></svg></span>
        <span class="tool-info">
          <span class="tool-name">番茄钟</span>
          <span class="tool-desc">专注计时 · 劳逸结合</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
      <a class="tool-item" href="./tools/qrcode/index.html" title="二维码生成">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3z"></path><path d="M21 14v7"></path><path d="M14 21h7"></path></svg></span>
        <span class="tool-info">
          <span class="tool-name">二维码生成</span>
          <span class="tool-desc">文本/网址/WiFi/名片</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
      <a class="tool-item" href="./tools/password/index.html" title="密码生成器">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
        <span class="tool-info">
          <span class="tool-name">密码生成器</span>
          <span class="tool-desc">强密码 · 强度评估</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
      <a class="tool-item" href="./tools/devtools/index.html" title="开发者工具箱">
        <span class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg></span>
        <span class="tool-info">
          <span class="tool-name">开发者工具箱</span>
          <span class="tool-desc">JSON/Base64/URL/正则</span>
        </span>
        <span class="tool-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </a>
    </div>
  </div>

  <footer><p>ASYS 科技 搜索起始页 版权所有</p></footer>

  <script src="lunar-calendar.js?v=202608260107"></script>
  <script src="script.js?v=202608260107"></script>
</body>
