<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教程中心 - 赛思科技 工作室</title>
    <link rel="shortcut icon" href="../img/asys.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css?v=202608260151">
    <link rel="stylesheet" href="../css/docs.css?v=202608260151">
    <link rel="stylesheet" href="../css/highlight-github.min.css?v=202608260151">
    <script src="../js/highlight.min.js?v=202608260151" defer></script>
    <script src="../js/global.js?v=202608260151" defer></script>
</head>
<body class="site-asys page-tutorials">

    <div id="app-header"></div>

    <section class="hero-section">
        <div class="container">
            <h1 style="font-size: 2.5rem; margin-bottom: 15px; color: #0f172a;">教程中心</h1>
            <p style="font-size: 1.1rem; color: #475569; max-width: 600px; margin: 0 auto;">
                学习系统安装、驱动配置和各种技术教程，提升您的技术能力。
            </p>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="tutorial-layout">
                <aside class="tutorial-sidebar">
                    <h3>教程目录</h3>
                    <div id="sidebar-loading" class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在加载目录...</p>
                    </div>
                    <ul class="toc-list" id="tutorial-list" style="display: none;"></ul>
                    <div id="sidebar-error" style="display: none; text-align: center; color: #ef4444;"><p>❌ 无法加载目录</p></div>
                </aside>
                
                <main class="tutorial-content">
                    <div class="content-placeholder" id="content-placeholder">
                        <div class="icon">📚</div>
                        <h3>选择教程</h3>
                        <p>点击左侧目录中的教程标题开始阅读</p>
                    </div>
                    <div id="tutorial-content" class="embedded-content" style="display: none;"></div>
                    <div id="content-loading" class="loading" style="display: none;">
                        <div class="loading-spinner"></div>
                        <p>正在加载内容...</p>
                    </div>
                    <div id="content-error" class="content-placeholder" style="display: none;">
                        <div class="icon">❌</div>
                        <h3>加载失败</h3>
                        <p>无法加载教程内容，请稍后重试</p>
                    </div>
                </main>
            </div>
        </div>
    </section>

    <div id="app-footer"></div>
</body>
</html>
