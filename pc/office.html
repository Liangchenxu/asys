        .container { width: 90%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* 导航栏 */
        header { background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e2e8f0; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .logo img { height: 40px; }
        .logo h1 { font-size: 1.3rem; font-weight: 700; color: #0f172a; }
        
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: #475569; text-decoration: none; font-weight: 500; transition: color 0.3s; position: relative;}
        .nav-links a:hover, .nav-links a.active { color: #4f46e5; }
        .nav-links a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background-color: #4f46e5; }

        .hero-section { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); text-align: center; padding: 80px 0; border-bottom: 1px solid #bae6fd; }

        .block-icon { font-size: 1.8rem; background: #eff6ff; color: #4f46e5; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
        .block-title { font-size: 1.5rem; color: #1e293b; font-weight: 700; }

        /* 搜索和分类控件区 */
        .tools-controls { margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }
        
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
            color: #1e293b;
        }
        .search-box input:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .search-box input::placeholder { color: #94a3b8; }

        .category-filters { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            color: #475569;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-btn:hover { background: #e2e8f0; color: #1e293b; }
        .filter-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }

        /* 工具列表样式 */
        .tools-list { display: flex; flex-direction: column; gap: 30px; min-height: 200px;}
        .tool-item { display: flex; background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; transition: all 0.3s ease; animation: fadeIn 0.4s; }
        .tool-item:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-color: #cbd5e1; }
        .tool-visual { flex: 0 0 200px; background: #f8fafc; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e2e8f0; padding: 20px; }
        .tool-icon-large { font-size: 4rem; }
        .tool-details { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: center; }
        .tool-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .tool-title { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 5px; }
        .tool-desc { color: #64748b; margin-bottom: 20px; line-height: 1.6; }
        
        .tool-action { display: flex; gap: 15px; }
        .btn-download { background: #1e293b; color: white; padding: 10px 25px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }
        .btn-outline { background: transparent; color: #475569; border: 1px solid #cbd5e1; padding: 10px 25px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .btn-outline:hover { border-color: #475569; color: #1e293b; background: #f1f5f9; }

        .loading-text { text-align: center; color: #64748b; padding: 50px; font-size: 1.1rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        footer { background: #f1f5f9; padding: 40px 0; text-align: center; border-top: 1px solid #e2e8f0; color: #64748b; margin-top: 80px; }

        /* 手机端适配 */
        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; width: 100%; gap: 10px; }
            
            .hero-section h1 { font-size: 2rem; }
            .service-block { padding: 20px; } 

            .tool-item { flex-direction: column; }
            .tool-visual { flex: 0 0 auto; padding: 30px; border-right: none; border-bottom: 1px solid #e2e8f0; }
            .tool-details { padding: 20px; }
            
            .tool-action { flex-direction: column; }
            .btn-download, .btn-outline { width: 100%; justify-content: center; }
        }

        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

                category: "2024",
                iconImg: "../img/365.png",
                downloadUrl: "https://officecdn.microsoft.com/db/492350f6-3a01-4f97-b9c0-c7c6ddf67d60/media/zh-cn/ProPlus2024Retail.img",
                tutorialUrl: "",

            },
            {
                title: "Office 2021 专业增强版 (Windows)",

                iconImg: "../img/o19.png",
                downloadUrl: "https://officecdn.microsoft.com/db/492350f6-3a01-4f97-b9c0-c7c6ddf67d60/media/zh-cn/ProPlus2021Retail.img",
                tutorialUrl: "",

            },
            {
                title: "Office 2019 专业增强版 (Windows)",
                desc: "Office 2019 Professional Plus 官方原版安装包。已经停止支持，建议切换到Office 2021或者Office 2024。",
                category: "2019",
                iconImg: "../img/o19.png",
                downloadUrl: "https://officecdn.microsoft.com/db/492350f6-3a01-4f97-b9c0-c7c6ddf67d60/media/zh-cn/ProPlus2019Retail.img",
                tutorialUrl: "",
                keywords: ["2019", "pro plus", "windows", "专业版"]
            },
            {
                title: "Office 2016 专业增强版 (Windows)",
                desc: "Office 2016 Professional Plus 官方原版安装包，也是最后一个支持Windows 7/8/8.1的版本，同时也是最后一个支持MSI安装程序，可以自定义安装位置的版本。已停止支持。",
                category: "2016",
                iconImg: "../img/o16.png",
                downloadUrl: "https://officecdn.microsoft.com/db/492350f6-3a01-4f97-b9c0-c7c6ddf67d60/media/zh-cn/ProPlusRetail.img",
                tutorialUrl: "",

            },
            {

                desc: "Office 2013 Professional 官方原版安装包。已停止支持。",
                category: "2013",
                iconImg: "../img/o16.png",
                downloadUrl: "https://officecdn.microsoft.com/db/39168d7e-077b-48e7-872c-b232c3e72675/media/zh-cn/ProfessionalRetail.img",
                tutorialUrl: "",
                keywords: ["2013", "pro plus", "windows", "专业版", "老电脑"]
            },
            {
                title: "Office 2010 专业增强版 (Windows)",
                desc: "Office 2010 Professional Plus 官方原版安装包，同时也是最后一个支持Windows XP和Windows Vista的版本。已停止支持。此处仅提供32位(x86)版本下载。",
                category: "2010",
                iconImg: "../img/o10.png",
                downloadUrl: "https://buzzheavier.com/qgas55t4r8jy",
                tutorialUrl: "",
                keywords: ["2013", "pro plus", "windows", "专业版", "老电脑","xp"]
            },

            // ================= MAC 版本分类 =================
            {
                title: "Office for Mac 最新版 (适用于 macOS 13 及以上)",
                desc: "这是微软官方随时保持最新的通用安装包。安装后可根据账号激活为 365 或 2024。适用于 macOS Ventura (13), Sonoma (14), Sequoia (15) 等最新系统。",
                category: "mac",
                iconImg: "../img/apple.svg", // 读取同一目录下的 apple.svg
                // 这个是微软官网永久获取 Mac 最新版 Office 的直链

                tutorialUrl: "",
                keywords: ["mac", "macos", "ventura", "sonoma", "sequoia", "最新", "苹果"]

            {

                desc: "这是 macOS 12 Monterey 系统所能支持的最终版本 (16.89)。由于微软停更策略，此系统无法安装更高版本的 Office。",
                category: "mac",
                iconImg: "../img/apple.svg",
                // 提取自微软官方最终版历史记录的 16.89 独立安装包

                tutorialUrl: "",
                keywords: ["mac", "macos", "monterey", "12", "苹果"]
            },
            {
                title: "Office for Mac (macOS 11 Big Sur 专属版)",
                desc: "这是 macOS 11 Big Sur 老系统所能支持的最终版本 (16.77)。此安装包专为无法升级系统的老 Mac 准备。",
                category: "mac",
                iconImg: "../img/apple.svg",
                // 提取自微软官方最终版历史记录的 16.77 独立安装包
                downloadUrl: "https://officecdn.microsoft.com/pr/C1297A47-86C4-4C1F-97FA-950631F94777/MacAutoupdate/Microsoft_Office_16.77.23091003_BusinessPro_Installer.pkg",
                tutorialUrl: "",
                keywords: ["mac", "macos", "big sur", "11", "苹果"]
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            allToolsData = officeData;
            renderTools(allToolsData);
        });

        function renderTools(toolsToRender) {
            toolsContainer.innerHTML = ''; 

            if (toolsToRender.length === 0) {
                toolsContainer.innerHTML = '<div class="loading-text">没有找到匹配的版本 😢</div>';
                return;
            }

            toolsToRender.forEach(tool => {
                const tutorialButton = tool.tutorialUrl 
                    ? `<a href="${tool.tutorialUrl}" class="btn-outline" target="_blank">安装教程</a>` 
                    : '';

                // ★ 修改了这里的路径：去掉了原本的 "icons/"，直接读取相对路径下的图片文件
                const iconDisplay = tool.iconImg 
                    ? `<img src="${tool.iconImg}" alt="${tool.title}" style="width: 70px; height: 70px; object-fit: contain;">`
                    : `<div class="tool-icon-large">${tool.icon}</div>`;

                const htmlStr = `
                    <div class="tool-item">
                        <div class="tool-visual">
                            ${iconDisplay}
                        </div>
                        <div class="tool-details">
                            <div class="tool-header"><div><h3 class="tool-title">${tool.title}</h3></div></div>
                            <p class="tool-desc">${tool.desc}</p>
                            <div class="tool-action">
                                <a href="${tool.downloadUrl}" class="btn-download" target="_blank"><span>⬇</span> 立即下载 </a>
                                ${tutorialButton}
                            </div>
                        </div>
                    </div>
                `;
                toolsContainer.insertAdjacentHTML('beforeend', htmlStr);
            });
        }

        function filterAndSearchTools() {
            const keyword = searchInput.value.trim().toLowerCase();

            const filtered = allToolsData.filter(tool => {
                const matchCategory = (currentFilter === 'all') || (tool.category === currentFilter);
                let matchSearch = true;
                if (keyword !== '') {
                    const titleMatch = tool.title.toLowerCase().includes(keyword);
                    const descMatch = tool.desc.toLowerCase().includes(keyword);
                    const keywordMatch = tool.keywords ? tool.keywords.some(k => k.toLowerCase().includes(keyword)) : false;
                    matchSearch = titleMatch || descMatch || keywordMatch;
                }
                return matchCategory && matchSearch;
            });

            renderTools(filtered);
        }

        searchInput.addEventListener('input', filterAndSearchTools);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                filterAndSearchTools();
            });
        });
    </script>
