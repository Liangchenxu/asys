<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载 Vantage - ASYS 科技</title>
    <link rel="shortcut icon" href="../img/asys.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/global.js" defer></script>
</head>
<body class="site-vantage page-vdownload"> 

    <div id="app-header"></div>

    <header class="page-header">
        <h1>下载 Vantage</h1>
        <p>选择适合您操作系统的版本，体验更易用、更隐私的浏览环境。</p>
        
        <div class="auto-btn-wrapper" id="smart-download-section">
            <a href="#" id="smart-btn" class="btn-smart">
                <span id="smart-icon">⏳</span> <span id="smart-text">正在读取配置...</span>
            </a>
        </div>

		<div id="version-display" style="font-size: 0.85rem; color: #9ca3af; margin-top: 25px;">正在加载版本信息...</div>
		<div style="font-size: 0.85rem; color: #9ca3af; margin-top: 15px;">Vantage是自由软件，不提供任何担保</div>
        
        <div class="warning-box">
		<strong>Windows旧版本用户注意：</strong>如果你的Vantage版本小于等于149.0-1请下载<a href="./migrate.bat">配置迁移工具</a>。
        </div>
    </header> 

    <div class="download-container">
        <div class="os-grid">
            
            <div class="os-card">
                <img src="../img/windows11.png" alt="Windows" class="os-icon-img">
                <div class="os-title">Windows</div>
                <div style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 25px;">支持 Windows 10 和 Windows 11</div>
                <div class="btn-group">
                    <a href="#" id="btn-win" class="btn-primary">下载安装包</a>
                    <a href="https://pan.quark.cn/s/6a83898d6142" target="_blank" class="btn-secondary">网盘分流 (推荐)</a>
                </div>
            </div>

            <div class="os-card">
                <img src="../img/linuxpg.png" alt="Linux" class="os-icon-img">
                <div class="os-title">Linux</div>
                <select id="linux-format" class="pkg-select">
                    <option value="deb">Debian / Ubuntu (.deb)</option>
                    <option value="rpm">Red Hat / Rocky (.rpm)</option>
                    <option value="appimage">免安装版 (AppImage)</option>
                    <option value="tar">便携压缩包 (.tar.gz)</option>
                    <option value="tar_xz">高压缩便携包 (.tar.xz)</option>
                </select>
                <select id="linux-arch" class="pkg-select" style="margin-bottom: 25px;">
                    <option value="x64">64位 (AMD64 / x86_64)</option>
                    <option value="arm64">ARM 64位 (AArch64)</option>
                </select>
                <div class="btn-group">
                    <a href="#" id="btn-linux" class="btn-primary">下载</a>
                    <a href="https://pan.quark.cn/s/6a83898d6142" target="_blank" class="btn-secondary">网盘分流 (推荐)</a>
                </div>
            </div>

            <div class="os-card">
                <img src="../img/apple.svg" alt="macOS" class="os-icon-img">
                <div class="os-title">macOS</div>
                <select id="mac-arch" class="pkg-select" style="margin-bottom: 25px;">
                    <option value="intel">Intel 芯片版</option>
                    <option value="apple">Apple （暂不支持M系列芯片）</option>
                </select>
                <div class="btn-group">
                    <a href="#" id="btn-mac" class="btn-primary">下载</a>
                    <a href="https://pan.quark.cn/s/6a83898d6142" target="_blank" class="btn-secondary">网盘分流 (推荐)</a>
                </div>
            </div>

            <div class="os-card" style="border-color: #fbbf24; background-color: #fffbeb;">
                <img src="../img/ublock.svg" alt="uBlock Origin" class="os-icon-img" style="width: 50px; height: 50px;">
                <div class="os-title" style="margin-bottom: 10px; color: #b45309;">uBlock Origin</div>
                <p style="font-size: 0.9rem; color: #b45309; margin-bottom: 20px;">部分用户可能需要手动下载此文件。</p>
                <div class="btn-group">
                    <a href="../vantage/uBlock.xpi" class="btn-warning-dark">下载 (.xpi)</a>
                    <a href="/vantage/docs.html#ublock-tutorial" class="btn-secondary">查看教程</a>
                </div>
            </div>

        </div>
    </div>

    <div id="app-footer"></div>

</body>
</html>
