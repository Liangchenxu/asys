<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开源支持证书查询 - 赛思科技</title>
    <link rel="shortcut icon" href="../img/asys.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/global.js" defer></script>
    <style>
        .query-section {
            padding: 80px 20px 120px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .query-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .query-card h2 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 15px;
            font-weight: 800;
        }
        .query-card p.subtitle {
            color: #64748b;
            font-size: 1.05rem;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .query-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .cert-input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            font-family: monospace;
            background: #f8fafc;
            color: #1e293b;
            font-weight: bold;
        }
        .cert-input:focus {
            border-color: var(--asys-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .submit-btn {
            background: var(--asys-blue);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.15rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover { background: #4338ca; transform: translateY(-2px); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        /* 结果展示卡片 UI */
        .result-area {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.4s ease-out;
            text-align: left;
        }
        .result-box { padding: 30px; border-radius: 16px; }
        
        .result-success { background: #f0fdf4; border: 1px solid #bbf7d0; }
        .result-success h3 { color: #15803d; }
        
        .result-warning { background: #fffbeb; border: 1px solid #fde68a; }
        .result-warning h3 { color: #b45309; }
        
        .result-error { background: #fef2f2; border: 1px solid #fecaca; }
        .result-error h3 { color: #b91c1c; }

        .result-box h3 {
            margin-top: 0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
        }
        .info-row {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #334155;
            display: flex;
            align-items: center;
        }
        .info-row strong {
            display: inline-block;
            width: 90px;
            color: #0f172a;
            font-weight: 700;
        }
        .divider {
            height: 1px;
            border-bottom: 1px dashed #cbd5e1;
            margin: 20px 0;
        }
        .donate-msg {
            font-size: 1.05rem;
            color: #475569;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="site-asys page-donation"> 
    <header>
        <div class="container">
            <nav>
                <a href="../index.html" class="debian-logo">
                    <img src="../img/ASYS-3.png" alt="赛思科技 Logo">
                    <h1>赛思科技</h1>
                </a>
                <div class="debian-nav-links">
                    <a href="../index.html">首页</a>
                    <a href="../service-guide.html">自助服务</a>
                    <a href="../products.html">产品</a>
                    <a href="../tutorials.html">教程</a>
                    <a href="../vantage/index.html">Vantage浏览器</a>
                    <a href="../about.html">关于 & 联系</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="query-section">
        <div class="query-card">
            <h2>开源支持证书查询</h2>
            <p class="subtitle">感谢您选择 ASYS科技 提供的 Debian 安装介质。<br>请输入证书左下角的 6 位十六进制编号以验证您的捐赠记录。</p>
            
            <form class="query-form" id="donationForm">
                <input type="text" id="certCode" class="cert-input" placeholder="输入6位编号 (例如: 1A2B3C)" maxlength="6" pattern="[0-9A-Fa-f]{6}" required autocomplete="off">
                <button type="submit" id="submitBtn" class="submit-btn">查询记录</button>
            </form>

            <div class="result-area" id="resultArea"></div>
        </div>
    </main>

    <footer>
        <div class="container" style="text-align: center; padding: 40px 0; color: #64748b;">
            <p>© 2026 赛思科技. 保留所有权利。</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('donationForm');
        const input = document.getElementById('certCode');
        const btn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('resultArea');

        // 输入时自动转为大写，过滤非16进制字符
        input.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = input.value;

            if (!/^[0-9A-F]{6}$/.test(code)) {
                alert("请输入有效的 6 位 16 进制证书编号！");
                return;
            }

            // 切换为加载状态
            btn.disabled = true;
            btn.innerText = "正在查询数据...";
            resultArea.style.display = "none";

            try {
                // 🚀 正式请求 Cloudflare 后端接口
                const response = await fetch(`https://cert.asystech.cn/?code=${code}`);
                
                if (!response.ok) throw new Error("服务器响应异常");
                
                const resultJson = await response.json();
                let htmlContent = '';
                
                // 判断捐赠状态，渲染不同的 UI
                if (resultJson.status === 2) {
                    htmlContent = `
                        <div class="result-box result-success">
                            <h3>✅ 证书有效</h3>
                            <div class="info-row"><strong>证书编号:</strong> <span>${code}</span></div>
                            <div class="info-row"><strong>验证状态:</strong> <span style="color: #059669;">记录已确认</span></div>
                            <div class="divider"></div>
                            <div class="donate-msg">
                                您购买产品所支付的费用中，已有一部分被直接用于捐赠 Debian 项目，以支持自由软件基础设施与社区发展。感谢您的贡献！
                            </div>
                        </div>
                    `;
                } else if (resultJson.status === 1) {
                    htmlContent = `
                        <div class="result-box result-warning">
                            <h3>⏳ 审核中</h3>
                            <div class="info-row"><strong>证书编号:</strong> <span>${code}</span></div>
                            <div class="info-row"><strong>验证状态:</strong> <span style="color: #d97706;">系统正在处理</span></div>
                            <div class="divider"></div>
                            <div class="donate-msg">
                                您的购买记录正在录入捐赠系统中。由于跨国汇款或批处理原因，可能需要 1-3 个工作日完成审核，请稍后再次查询。
                            </div>
                        </div>
                    `;
                } else {
                    htmlContent = `
                        <div class="result-box result-error">
                            <h3>❌ 查无记录</h3>
                            <div class="info-row"><strong>证书编号:</strong> <span>${code}</span></div>
                            <div class="info-row"><strong>验证状态:</strong> <span style="color: #dc2626;">未录入</span></div>
                            <div class="divider"></div>
                            <div class="donate-msg">
                                抱歉，当前系统中未找到该编号的捐赠记录。请确认您输入的 6 位十六进制编号是否完全正确。如有疑问，请联系客服获取支持。
                            </div>
                        </div>
                    `;
                }

                resultArea.innerHTML = htmlContent;
                resultArea.style.display = "block";

            } catch (error) {
                console.error(error);
                alert("网络请求失败，请检查网络或联系管理员！");
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.innerText = "查询记录";
            }
        });
    </script>
</body>
</html>
