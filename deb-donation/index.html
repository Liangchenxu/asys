<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?v=202607192040" async defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开源支持证书查询 - 赛思科技</title>
    <link rel="shortcut icon" href="../img/asys.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css?v=202607192040">
    <script src="../js/global.js?v=202607192040" defer></script>
    <style>
        .query-section {
            padding: 80px 20px 120px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .query-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .query-card h2 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 15px;
            font-weight: 800;
        }
        .query-card p.subtitle {
            color: #64748b;
            font-size: 1.05rem;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .query-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .cert-input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 6px;
            text-transform: uppercase;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            font-weight: bold;
        }

        .cf-turnstile {
            margin: 12px 0;
            display: flex;
            justify-content: center;
        }
        
        .cert-input::placeholder {
            letter-spacing: normal;
            font-size: 1rem;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', sans-serif;
            color: #94a3b8;
            font-weight: normal;
        }

        .cert-input:focus {
            border-color: var(--asys-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* 隐私政策勾选框样式 */
        .privacy-checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 5px;
            line-height: 1.5;
        }
        .privacy-checkbox-container input[type="checkbox"] {
            margin-top: 4px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .privacy-checkbox-container a {
            color: var(--asys-blue);
            text-decoration: none;
            font-weight: bold;
        }
        .privacy-checkbox-container a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            background: var(--asys-blue);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.15rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover { background: #4338ca; transform: translateY(-2px); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        /* 结果展示卡片 UI */
        .result-area {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.4s ease-out;
            text-align: left;
        }
        .result-box { padding: 30px; border-radius: 16px; }
        
        .result-success { background: #f0fdf4; border: 1px solid #bbf7d0; }
        .result-success h3 { color: #15803d; }
        
        .result-warning { background: #fffbeb; border: 1px solid #fde68a; }
        .result-warning h3 { color: #b45309; }
        
        .result-error { background: #fef2f2; border: 1px solid #fecaca; }
        .result-error h3 { color: #b91c1c; }

        .result-box h3 {
            margin-top: 0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
        }
        .info-row {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #334155;
            display: flex;
            align-items: center;
        }
        .info-row strong {
            display: inline-block;
            width: 90px;
            color: #0f172a;
            font-weight: 700;
        }
        .divider {
            height: 1px;
            border-bottom: 1px dashed #cbd5e1;
            margin: 20px 0;
        }
        .donate-msg {
            font-size: 1.05rem;
            color: #475569;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手机端适配 */
        @media (max-width: 600px) {
            .query-section { padding: 40px 15px 60px; }
            .query-card { padding: 30px 20px; }
            .query-card h2 { font-size: 1.5rem; }
            .query-card p.subtitle { font-size: 0.95rem; margin-bottom: 25px; }
            .cert-input { font-size: 1.3rem; padding: 15px; letter-spacing: 2px; }
            .cert-input::placeholder { font-size: 0.9rem; }
            .cf-turnstile { margin: 8px 0; }
            .result-box { padding: 20px; }
            .result-box h3 { font-size: 1.2rem; }
            .info-row { flex-direction: column; align-items: flex-start; gap: 5px; }
            .info-row strong { width: auto; }
        }
    </style>
</head>
<body class="site-asys page-donation"> 
    <header>
        <div class="container">
            <nav>
                <a href="../index.html" class="debian-logo">
                    <img src="../img/ASYS-3.png" alt="赛思科技 Logo">
                    <h1>赛思科技</h1>
                </a>
                <div class="debian-nav-links">
                    <a href="../index.html">首页</a>
                    <a href="../service-guide.html">自助服务</a>
                    <a href="../products.html">产品</a>
                    <a href="../tutorials.html">教程</a>
                    <a href="../vantage/index.html">Vantage浏览器</a>
                    <a href="../about.html">关于 & 联系</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="query-section">
        <div class="query-card">
            <h2>开源支持证书查询</h2>
            <p class="subtitle">感谢您选择 ASYS科技 提供的 Debian 安装介质。<br>请输入证书左下角的 6 位十六进制编号以验证您的捐赠记录。</p>
            
            <form class="query-form" id="donationForm">
                <input type="text" id="certCode" class="cert-input" placeholder="输入编号 (例如： 1A2 B3C)" maxlength="7" required autocomplete="off">
                
                <div class="cf-turnstile" data-sitekey="0x4AAAAAADKvxJ8XvkXsPIZR"></div>

                <div class="privacy-checkbox-container">
                    <input type="checkbox" id="privacyCheck">
                    <label for="privacyCheck">我已核对编号并确认查询</label>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">查询记录</button>
            </form>

            <div class="result-area" id="resultArea"></div>
        </div>
    </main>

    <footer>
        <div class="container" style="text-align: center; padding: 40px 0; color: #64748b;">
            <p>© 2026 赛思科技. 保留所有权利。</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('donationForm');
        const input = document.getElementById('certCode');
        const btn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('resultArea');
        const privacyCheck = document.getElementById('privacyCheck'); // 获取勾选框元素

        // 输入时自动格式化：过滤字符并在第3位后加空格
        input.addEventListener('input', function(e) {
            let val = e.target.value.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
            if (val.length > 3) {
                val = val.slice(0, 3) + ' ' + val.slice(3, 6);
            }
            e.target.value = val;
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // 🚀 第一步：验证是否勾选隐私政策
            if (!privacyCheck.checked) {
                alert("请先勾选“我已核对编号并确认查询”后再进行查验。");
                return;
            }
            
            // 提交时，把空格剔除掉，拿到的依然是纯净的 6 位验证码发给后端
            const code = input.value.replace(/\s+/g, '');

            const turnstileResponseElement = document.querySelector('[name="cf-turnstile-response"]');
            const token = turnstileResponseElement ? turnstileResponseElement.value : '';

            if (!token) {
                alert("请先完成人机验证！");
                return;
            }

            if (!/^[0-9A-F]{6}$/.test(code)) {
                alert("请输入有效的 6 位 16 进制证书编号！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "正在查询数据...";
            resultArea.style.display = "none";

            try {
                const response = await fetch('https://cert.asystech.cn/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        code: code,
                        token: token
                    })
                });
                
                if (!response.ok) throw new Error("服务器响应异常");
                
                const resultJson = await response.json();
                let htmlContent = '';
                
                if (resultJson.status === 2) {
                    htmlContent = `
                        <div class="result-box result-success">
                            <h3>✅ 证书有效</h3>
                            <div class="info-row"><strong>证书编号:</strong> <span>${code}</span></div>
                            <div class="info-row"><strong>验证状态:</strong> <span style="color: #059669;">记录已确认</span></div>
                            <div class="divider"></div>
                            <div class="donate-msg">
                                您购买产品所支付的费用中，已有一部分被直接用于捐赠 Debian 项目，以支持自由软件基础设施与社区发展。感谢您的贡献！
                            </div>
                        </div>
                    `;
                } else if (resultJson.status === 1) {
                    htmlContent = `
                        <div class="result-box result-warning">
                            <h3>📝已录入</h3>
                            <div class="info-row"><strong>证书编号:</strong> <span>${code}</span></div>
                            <div class="info-row"><strong>验证状态:</strong> <span style="color: #d97706;">已经录入，等待审核中</span></div>
                            <div class="divider"></div>
                            <div class="donate-msg">
                                您的订单已经录入。正在等待财务审核，我们将会在交易平台售后追诉期结束后完成捐赠。这可能需要几天时间，具体取决于交易平台的政策。
                            </div>
                        </div>
                    `;
                } else {
                    htmlContent = `
                        <div class="result-box result-error">
                            <h3>❌ 查无记录</h3>
                            <div class="info-row"><strong>证书编号:</strong> <span>${code}</span></div>
                            <div class="info-row"><strong>验证状态:</strong> <span style="color: #dc2626;">未录入</span></div>
                            <div class="divider"></div>
                            <div class="donate-msg">
                                抱歉，当前系统中未找到该编号的捐赠记录。请确认您输入的 6 位十六进制编号是否完全正确。如有疑问，请联系客服获取支持。
                            </div>
                        </div>
                    `;
                }

                resultArea.innerHTML = htmlContent;
                resultArea.style.display = "block";

            } catch (error) {
                console.error(error);
                alert("网络请求失败，请检查网络或联系管理员！");
            } finally {
                btn.disabled = false;
                btn.innerText = "查询记录";
                
                if (typeof turnstile !== 'undefined') {
                    turnstile.reset();
                }
            }
        });
    </script>
</body>
</html>
